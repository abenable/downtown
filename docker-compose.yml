services:
  redis:
    image: redis:8-alpine
    container_name: downtown-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - downtown_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./downtown
      dockerfile: Dockerfile
    container_name: downtown-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"

  storefront:
    build:
      context: ./downtown-storefront
      dockerfile: Dockerfile
    container_name: downtown-storefront
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"

volumes:
  downtown_redis_data:
