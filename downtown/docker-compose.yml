services:
  # Downtown Backend (Server Mode)
  downtown:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: downtown
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Database
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Security
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # CORS
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:8000,http://localhost:9000}
      # Worker Mode (server = handles API requests + admin)
      MEDUSA_WORKER_MODE: ${MEDUSA_WORKER_MODE:-server}
      DISABLE_MEDUSA_ADMIN: ${DISABLE_MEDUSA_ADMIN:-false}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      # iOTEC Pay (unified mobile money)
      IOTEC_PAY_API_BASE_URL: ${IOTEC_PAY_API_BASE_URL:-https://pay.iotec.io}
      IOTEC_PAY_TOKEN_URL: ${IOTEC_PAY_TOKEN_URL:-https://id.iotec.io/connect/token}
      IOTEC_PAY_CLIENT_ID: ${IOTEC_PAY_CLIENT_ID}
      IOTEC_PAY_CLIENT_SECRET: ${IOTEC_PAY_CLIENT_SECRET}
      IOTEC_PAY_WALLET_ID: ${IOTEC_PAY_WALLET_ID}
      IOTEC_PAY_CALLBACK_URL: ${IOTEC_PAY_CALLBACK_URL}
      IOTEC_PAY_TIMEOUT_MS: ${IOTEC_PAY_TIMEOUT_MS:-20000}
      MOBILE_MONEY_REFUND_BASE_URL: ${MOBILE_MONEY_REFUND_BASE_URL}
      MOBILE_MONEY_REFUND_API_KEY: ${MOBILE_MONEY_REFUND_API_KEY}
      # SMS (UG-SMS)
      UGSMS_BASE_URL: ${UGSMS_BASE_URL:-https://ugsms.com}
      UGSMS_API_KEY: ${UGSMS_API_KEY}
      UGSMS_SENDER_ID: ${UGSMS_SENDER_ID:-Downtown}
      UGSMS_MESSAGE_TYPE: ${UGSMS_MESSAGE_TYPE:-transactional}
      # Cloudflare R2 Storage (S3-compatible)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
